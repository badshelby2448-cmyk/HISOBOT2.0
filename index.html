<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#b81d13">
<style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Yuk hisoboti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: bitta ustun, daftar tartibida: 2 ombor, top pul, rasxod, tayyor matn */
:root{--bg:#fff6d6;--card:#fffdf5;--fg:#33140c;--mut:#7a5340;--line:#f0cf7a;--ink:#b81d13;--on:#fff;--grad:linear-gradient(110deg,#b81d13,#cc4a08);--sun:linear-gradient(90deg,#c62015,#f57c00,#ffcc19);
--f:'Golos Text',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0d08;--card:#2b150d;--fg:#fff1d6;--mut:#d4ad84;--line:#5c3216;--ink:#ffc933;--on:#2b0d05;--grad:linear-gradient(110deg,#ffcc19,#ff8a3d);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c0d08;--card:#2b150d;--fg:#fff1d6;--mut:#d4ad84;--line:#5c3216;--ink:#ffc933;--on:#2b0d05;--grad:linear-gradient(110deg,#ffcc19,#ff8a3d);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f);font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
h1{margin:0;font-size:22px;color:#fff;background:linear-gradient(100deg,#a8150f 0%,#c93a0a 60%,#f5a000 100%);padding:14px;border-radius:8px}h2{margin:0 0 8px;font-size:17px;color:var(--ink)}
input,select,button,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0;width:100%}
button{cursor:pointer;width:auto}
button.main,nav button[aria-pressed="true"]{background:var(--grad);color:var(--on);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}nav button{width:100%}
section{border-top:4px solid transparent!important;background:linear-gradient(var(--card),var(--card)) padding-box,var(--sun) border-box!important;border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.item{padding:8px 0;border-bottom:1px solid var(--line)}.item[hidden]{display:none!important}
.top,.nums,.sum,.pay,.exp{display:grid;gap:6px;align-items:center}
.top{grid-template-columns:1fr auto auto;margin-bottom:4px}
.top input{border:0;padding:2px 0;font-weight:600;background:transparent}
.nums{grid-template-columns:1fr auto 1.1fr}
.val{text-align:right;color:var(--mut)}
.kg{display:flex;gap:4px;min-width:0}.kg button{padding:8px 12px}
.compact .item.p:not(.m){display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:0 8px;align-items:center;padding:4px 0}
.compact .item.p:not(.m) .top{grid-template-columns:1fr auto;gap:0;margin:0}.compact .item.p:not(.m) .top input{grid-column:1}.compact .item.p:not(.m) .x{grid-column:2;grid-row:1}.compact .item.p:not(.m) .nums{display:block}
.compact .item.p:not(.m) .x1,.compact .item.p:not(.m) [data-f="price"]{display:none}
.compact .item.p:not(.m) .val{grid-column:1/-1;grid-row:2;text-align:left;font-size:12px}
.picker{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:8px}.choices{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
.choices button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:11px 10px}.choices button span:last-child{white-space:nowrap;color:var(--mut)}.choices #nofound{padding:10px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tools button{width:100%}
.x{border:0;background:transparent;color:var(--mut);padding:2px 8px}
.sum{grid-template-columns:1fr auto;margin-top:10px;font-weight:700;font-size:17px}
.pay{grid-template-columns:1fr 1fr}.pay .val{grid-column:1}.pay .del{grid-column:2;justify-self:end}
.exp{grid-template-columns:1fr 1fr auto}
.add{margin-top:8px}
.mut{color:var(--mut);font-size:13px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 var(--f);margin:0 0 10px;user-select:all}
.row{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}td{padding:5px 0;border-bottom:1px solid var(--line)}td+td{text-align:right;padding-left:8px;white-space:nowrap}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap">
<main>
<h1>Yuk hisoboti</h1>
<nav><button data-v="day">Kunlik</button><button data-v="month">Oylik</button><button data-v="price">Narxlar</button></nav>
<div class="tools"><button id="compact"></button><button id="theme"></button></div>
<input type="date" id="date" aria-label="Sana">
<div class="mut" id="status" role="status"></div>
<div id="view" style="display:grid;gap:12px;grid-template-columns:minmax(0,1fr)"></div>
</main>
<script>
const WH={nq:"Nurli Quyosh",ut:"Uch Tepa"};
const LIST=[["SIYOB2",33900],["SIYOB3",33500],["Siyob4",33500],["Siyob5",33500],["Siyob6",30900],["ArbaT Tabaka (05-08)",30400],["Arba1 (08-09)",30400],["Arba2 (09-1.05)",28900],["Arba3 (1,05-1,15)",28900],["Arba4 (1.15-1.25)",28900],["Arba5 (1.25-1.4)",28900],["Arba6 (1.4-1.5)",28900],["KATTA ARBA 1.5-1,8",25900],["Asfa 12-13",27900],["YIRIK",24500],["Qopli 10-11",28500],["Qopli 1,1-1,3",27900],["Qopli 1,3-1,4",29500],["ARBA (okoroc)",27900],["Favorit ok.",16900],["Yangi okorocka (св.)",25900],["Turk golen",30900],["Golen YANGI",26900],["Qopcha golen (karobka)",30900],["ARBA golen (paket)",35900],["Qanot YANGI sv.",36900],["Qanot karobka (qop)",38500],["ARBA qanot (paket)",42500],["Yelkacha-B (Polsha)",29500],["Rus. Yelkacha",33500],["UKR. Yelkacha (A-klas)",36500],["File sv.",34500],["file (muzlagan)",35900],["Mayda file",22500],["ARBA file (+paket)",39900],["Yangi bedro (sv.)",31400],["Bedro ARBA paket",35900],["Bedro (siyob)",35400],["Bedro (marinovka)",35400],["Teri",11000],["Karkas",6000],["Oshqozon.",6900],["Jigar.",5500],["Pangasius (rasepnoy)",49500],["Pangasius (butun baliq)",49500],["BUTUN O'rdak",31300],["O‘rdak file",31500],["Terisiz O‘RDAK file",33500],["oyoqcha o'rdak",27900],["Sosiska (Canada🇨🇦)",26900],["Sosiska (Rossiya🇷🇺)",13500],["86- TIL",49900],["152-kalla go'sht",71900],["64-Sarpanja",93500]];
const DEF={ver:2,pct:0.2,nq:LIST,ut:LIST};
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dec=s=>parseFloat(String(s??"").replace(/\s/g,"").replace(",","."))||0;
const kgv=s=>Math.round(String(s??"").split("+").reduce((a,p)=>a+dec(p),0)*1000)/1000;
// pul: "100 000+800'000" kabi yozuvni qo'shib beradi
const money=s=>String(s??"").split("+").reduce((a,p)=>a+(parseInt(p.replace(/\D/g,""),10)||0),0);
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
const r1000=n=>Math.round(n/1000)*1000;
const kgf=n=>String(Math.round(n*100)/100).replace(".",",");
const whRaw=(d,k)=>d[k].reduce((a,r)=>a+kgv(r.kg)*money(r.price),0);
const payVal=(d,p)=>p.type==="Valyuta"?dec(p.amount)*money(p.rate):p.type==="Plastik"?money(p.amount)*(1-d.pct/100):money(p.amount);
const TYPES=["Naqd","Click","Plastik","Valyuta"];
function totals(d){const t={nq:r1000(whRaw(d,"nq")),ut:r1000(whRaw(d,"ut")),by:{},usd:0};
 TYPES.forEach(k=>t.by[k]=0);
 d.pays.forEach(p=>{t.by[p.type]+=payVal(d,p);if(p.type==="Valyuta")t.usd+=dec(p.amount)});
 t.by.Plastik=Math.round(t.by.Plastik);
 t.plRaw=d.pays.reduce((a,p)=>a+(p.type==="Plastik"?money(p.amount):0),0);t.plCut=t.plRaw-t.by.Plastik;
 t.load=t.nq+t.ut;t.got=TYPES.reduce((a,k)=>a+t.by[k],0);t.exp=d.exps.reduce((a,e)=>a+money(e.amount),0);t.cash=t.by.Naqd-t.exp;return t}
const plLine=(d,t)=>`${fmt(t.plRaw)} - ${kgf(d.pct)}% = ${fmt(t.by.Plastik)}`;
const signed=n=>(n<0?"-":"")+fmt(Math.abs(n));
function report(date,d){const t=totals(d),o=["📅 "+date.split("-").reverse().join(".")];
 for(const k in WH){const rows=d[k].filter(r=>kgv(r.kg));if(!rows.length)continue;
  o.push("",WH[k]);rows.forEach(r=>o.push(`${r.name}: ${kgf(kgv(r.kg))} kg × ${fmt(money(r.price))}`));o.push("Jami: "+fmt(t[k]))}
 o.push("","TOP PUL");
 TYPES.forEach(k=>{const l=d.pays.filter(p=>p.type===k&&payVal(d,p));if(!l.length)return;
  o.push(`${k}: ${fmt(t.by[k])}${k==="Plastik"?``:""}`);
  l.forEach(p=>{if(k==="Valyuta")o.push(`  ${p.who||"-"}: ${kgf(dec(p.amount))}$ × ${fmt(money(p.rate))}`);
   else if(p.who||l.length>1||String(p.amount).includes("+"))o.push(`  ${p.who?p.who+": ":""}${String(p.amount).split("+").map(x=>fmt(money(x))).join(" + ")}`)})});
 o.push("Jami pul: "+fmt(t.got));
 const ex=d.exps.filter(e=>money(e.amount));
 if(ex.length){o.push("","Rasxod: "+fmt(t.exp));ex.forEach(e=>o.push(`  ${e.name||"-"}: ${fmt(money(e.amount))}`))}
 if(ex.length)o.push("","Naqd qoldiq: "+signed(t.cash));
 if(t.plRaw)o.push("","Plastik: "+plLine(d,t));
 return o.join("\n")}

// hisobotni daftar ko'rinishida rasmga chizadi
function band(g,W,H){const x=g.createLinearGradient(0,0,W,0);x.addColorStop(0,"#b81d13");x.addColorStop(.5,"#f57c00");x.addColorStop(1,"#ffcc19");g.fillStyle=x;g.fillRect(0,0,W,16);g.fillRect(0,H-16,W,16)}
function picture(date,d){const t=totals(d),W=1200,c=document.createElement("canvas"),g=c.getContext("2d"),ops=[];
 const text=(s,x,y,o={})=>ops.push(()=>{g.font=`${o.b?700:400} ${o.s||28}px 'Golos Text',system-ui,sans-serif`;g.textAlign=o.a||"left";g.fillStyle=o.c||"#33140c";g.fillText(s,x,y,o.w||1100)});
 const line=(x,y,w)=>ops.push(()=>{g.fillStyle="#b81d13";g.fillRect(x,y,w,2)});
 const blue="#b81d13";
 text(date.split("-").reverse().join("."),W/2,70,{b:1,s:44,a:"center",c:blue});
 let low=130;
 Object.keys(WH).forEach((k,n)=>{const x=40+n*580,R=x+540;let y=145;
  text(WH[k],x+270,y,{b:1,s:34,a:"center",c:blue});y+=20;
  d[k].filter(r=>kgv(r.kg)).forEach(r=>{y+=78;text(r.name,x,y-34,{b:1,s:26,w:540});text(`${kgf(kgv(r.kg))} kg × ${fmt(money(r.price))}`,R,y-1,{a:"right",s:27,w:540});const ly=y+14;ops.push(()=>{g.fillStyle="#f0cf7a";g.fillRect(x,ly,540,1)})});
  y+=30;line(x,y,540);y+=48;text("Jami:",x,y,{b:1,s:34});text(fmt(t[k]),R,y,{b:1,s:34,a:"right",c:blue});low=Math.max(low,y)});
 let y=low+75;
 const row=(a,b,o={})=>{text(a,60,y,{w:700,...o});text(b,W-60,y,{a:"right",w:380,...o});y+=46};
 line(40,y-30,W-80);y+=20;
 text("Top pul",W/2,y,{b:1,s:36,a:"center",c:blue});y+=55;
 TYPES.forEach(k=>{const l=d.pays.filter(p=>p.type===k&&payVal(d,p));if(!l.length)return;
  row(k+(k==="Plastik"?``:""),fmt(t.by[k]),{b:1,s:30});
  l.forEach(p=>{let v="";if(k==="Valyuta")v=`${kgf(dec(p.amount))}$ × ${fmt(money(p.rate))}`;
   else if(p.who||l.length>1||String(p.amount).includes("+"))v=String(p.amount).split("+").map(a=>fmt(money(a))).join(" + ");
   if(v){text((p.who?p.who+": ":"")+v,90,y,{s:25,w:1050});y+=40}})});
 row("Jami pul",fmt(t.got),{b:1,s:34,c:blue});
 const ex=d.exps.filter(e=>money(e.amount));
 if(ex.length){line(40,y-24,W-80);y+=30;row("Rasxod",fmt(t.exp),{b:1,s:32});ex.forEach(e=>row("   "+(e.name||"-"),fmt(money(e.amount)),{s:27}));y+=15;row("Naqd qoldiq",signed(t.cash),{b:1,s:32,c:blue})}
 if(t.plRaw){y+=15;line(40,y-30,W-80);y+=20;text("Plastik: "+plLine(d,t),60,y,{b:1,s:34,c:blue,w:1080});y+=46}
 c.width=W;c.height=y+30;g.fillStyle="#fffdf5";g.fillRect(0,0,W,c.height);band(g,W,c.height);ops.forEach(f=>f());return c}
function monthData(m){const keys=Object.keys(store.days).filter(k=>k.startsWith(m)).sort(),s={load:0,got:0,exp:0},kg={};
 keys.forEach(k=>{const d=store.days[k],t=totals(d);for(const x in s)s[x]+=t[x];for(const w in WH)d[w].forEach(r=>{if(kgv(r.kg)){const n=WH[w]+": "+r.name;kg[n]=(kg[n]||0)+kgv(r.kg)}})});
 return {keys,s,kg}}
function monthPicture(m){const {keys,s,kg}=monthData(m),W=1200,items=Object.entries(kg),c=document.createElement("canvas");
 c.width=W;c.height=470+items.length*54;const g=c.getContext("2d");g.fillStyle="#fffdf5";g.fillRect(0,0,W,c.height);band(g,W,c.height);
 let y=80;const row=(a,b,size=30,col="#33140c")=>{g.font=`${size>30?700:400} ${size}px 'Golos Text',system-ui,sans-serif`;g.fillStyle=col;g.textAlign="left";g.fillText(a,60,y,750);g.textAlign="right";g.fillText(b,W-60,y,320);y+=54};
 row(`Oylik hisobot ${m.split("-").reverse().join(".")}`,`${keys.length} kun`,42,"#b81d13");y+=20;
 row("Olingan yuk",fmt(s.load),34);row("Yig'ilgan pul",fmt(s.got),34);row("Rasxod",fmt(s.exp),34);y+=40;
 row("Mahsulotlar","",36,"#b81d13");items.forEach(([n,v])=>row(n,kgf(v)+" kg"));return c}
async function saveImage(btn){const msg=$("#imgmsg"),box=$("#img");
 try{await document.fonts?.ready}catch(e){}
 const mon=view==="month",c=mon?monthPicture(date.slice(0,7)):picture(date,cur()),name=mon?`oylik-${date.slice(0,7)}.png`:`hisobot-${date}.png`;
 box.src=c.toDataURL("image/png");box.hidden=false;
 const hold="Rasm pastda tayyor. Uni bosib turib saqlashingiz yoki skrinshot olishingiz mumkin.";
 if(!downloads){const l=document.createElement("a");l.href=box.src;l.download=name;document.body.append(l);l.click();l.remove();
  msg.textContent="Rasm yuklashga berildi. Yuklanmasa, pastdagi rasmni bosib turib saqlang.";return}
 btn.disabled=true;
 try{const blob=await new Promise(r=>c.toBlob(r,"image/png"));await downloads.save({filename:name,data:blob});msg.textContent="Rasm yuklashga berildi."}
 catch(e){msg.textContent=hold}
 finally{btn.disabled=false}}
let downloads=null;
const ui={};try{Object.assign(ui,JSON.parse(localStorage.getItem("yuk-ui")||"{}"))}catch(e){}
const isDark=()=>{const t=ui.theme||document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function applyUi(){if(ui.theme)document.documentElement.dataset.theme=ui.theme;
 document.querySelector("main").classList.toggle("compact",!!ui.compact);
 $("#compact").textContent=ui.compact?"To'liq ko'rinish":"Ixcham ko'rinish";
 $("#theme").textContent=isDark()?"☀️ Kunduzgi":"🌙 Tungi"}
function setUi(k,v){ui[k]=v;try{localStorage.setItem("yuk-ui",JSON.stringify(ui))}catch(e){}applyUi()}
(async()=>{try{downloads=await window.claude?.use("downloads")}catch(e){}})();

function download(name,blob){const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download=name;document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function backup(){const blob=new Blob([JSON.stringify({app:"yuk",cat:store.cat,catAt:store.catAt,days:store.days})],{type:"application/json"}),name=`yuk-zaxira-${date}.json`;
 try{if(downloads)await downloads.save({filename:name,data:blob});else download(name,blob);$("#bmsg").textContent=`Zaxira yuklashga berildi (${Object.keys(store.days).length} kunlik hisobot). Yuklamalar papkasida fayl borligini tekshiring.`}
 catch(e){$("#bmsg").textContent="Zaxira yuklanmadi. Qayta urinib ko'ring."}}
const list=a=>Array.isArray(a)&&a.every(x=>x&&typeof x==="object");
const goodDay=d=>d&&["nq","ut","pays","exps"].every(k=>list(d[k]))&&d.pays.every(p=>TYPES.includes(p.type));
const goodCat=c=>c&&["nq","ut"].every(k=>Array.isArray(c[k])&&c[k].every(Array.isArray));
// mavjud yangiroq yozuvlar ustidan yozilmaydi
async function restore(file){let msg;try{const v=JSON.parse(await file.text());if(v.app!=="yuk"||!v.days)throw 0;
  let n=0,skip=0;for(const [k,d] of Object.entries(v.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!goodDay(d)){skip++;continue}
   if(!store.days[k]||(d.at||0)>(store.days[k].at||0)){store.days[k]=d;dirty.add(k);n++}else skip++}
  const empty=["nq","ut"].every(k=>store.cat[k].every(r=>!r[1]));
  if(goodCat(v.cat)&&(empty||v.catAt>store.catAt)){store.cat=v.cat;store.catAt=v.catAt||Date.now();dirty.add("prices")}
  draft=null;migrate();tidy();keep();flush();render();msg=`Tiklandi: ${n} kun. O'zgarishsiz qoldi: ${skip}.`}
 catch(e){msg="Bu fayl o'qilmadi. Shu ilovadan olingan zaxira faylini tanlang."}
 $("#bmsg").textContent=msg}
// Telegramdan nusxalangan narxlar ro'yxati
let imp=null,impText="",impMsg="";
const norm=n=>String(n).toLowerCase().replace(/[^\p{L}\p{N}()]/gu,"");
// qavs ichida faqat o'lcham bo'lsa (1.15-1.25), nomni solishtirishda hisobga olinmaydi
const short=n=>norm(String(n).replace(/\([\d\s.,\-–]+\)/g,"").replace(/\s[\d.,]+\s*-\s*[\d.,]+\s*$/,""));
function parseList(text){const items=[],seen={};let day="";
 text.split(/\n/).forEach(line=>{const dm=line.match(/^\s*(\d{2})\.(\d{2})\.(\d{4})/);if(dm){day=`${dm[3]}-${dm[2]}-${dm[1]}`;return}
  const m=line.match(/^\s*(.*\S)\s*[-–—]\s*(\d{1,3}[  ]?\d{3})(?![\d%.,]*\d)[^\d%]*$/);if(!m)return;
  const name=m[1].replace(/[\s.\-–—]+$/,""),price=money(m[2]),key=norm(name);if(!key||price<1000)return;
  if(seen[key]){if(seen[key].price!==price)seen[key].clash=true;return}items.push(seen[key]={name,key,price})});
 return {day,items}}
function startImport(text){const r=parseList(text);if(!r.items.length){imp=null;impMsg="Narx topilmadi. Har bir qator \"Nomi - 33500\" ko'rinishida bo'lsin.";return}
 const items=r.items.filter(x=>!x.clash),map=store.cat.map||{},pick={};
 for(const k in WH)store.cat[k].forEach(([n],i)=>{const id=k+":"+n;let f;
  if(map[id])f=items.find(x=>x.key===map[id]);
  else{let l=items.filter(x=>x.key===norm(n));if(!l.length)l=items.filter(x=>short(x.name)===short(n));if(l.length===1)f=l[0]}
  pick[k+i]=f?f.key:""});
 imp={day:r.day||date,items,pick,add:[],useDay:true};
 const bad=r.items.filter(x=>x.clash);impMsg=`${items.length} ta narx topildi.`+(bad.length?` Ikki xil narx yozilgani uchun olinmadi: ${bad.map(x=>x.name).join(", ")}.`:"")}
const opts=sel=>`<option value="">O'zgartirilmasin</option>`+imp.items.map(x=>`<option value="${esc(x.key)}"${x.key===sel?" selected":""}>${esc(x.name)}: ${fmt(x.price)}</option>`).join("");
function importHtml(){let h=`<section><h2>Telegramdan narx olish</h2><textarea id="paste" rows="5" placeholder="Guruhdagi narxlar xabarini shu yerga qo'ying" aria-label="Narxlar xabari">${esc(impText)}</textarea><button class="main add" id="check">Narxlarni tekshirish</button><div class="mut" role="status" style="margin-top:8px">${esc(impMsg)}</div>`;
 if(imp){for(const k in WH){h+=`<h2 style="margin-top:14px">${WH[k]}</h2>`+store.cat[k].map(([n,old],i)=>{const f=imp.items.find(x=>x.key===imp.pick[k+i]);
    return `<div class="item"><b>${esc(n)}</b><div class="mut">${f?`${fmt(old)} → <b>${fmt(f.price)}</b>${f.price===old?" (o'zgarmadi)":""}`:`Mos nom tanlanmagan, ${fmt(old)} qoladi`}</div><select data-pick="${k+i}" id="pick${k+i}" aria-label="${esc(n)} uchun ro'yxatdagi nom">${opts(imp.pick[k+i])}</select></div>`}).join("")}
  h+=`<h2 style="margin-top:14px">Yangi mahsulot qo'shish</h2><select id="newitem" aria-label="Ro'yxatdagi mahsulot">${opts("").replace("O'zgartirilmasin","Mahsulotni tanlang")}</select><div class="row add">${Object.keys(WH).map(k=>`<button data-new="${k}">${WH[k]}ga</button>`).join("")}</div>`;
  h+=imp.add.map(a=>`<div class="mut">+ ${WH[a.k]}: ${esc(imp.items.find(x=>x.key===a.key).name)}</div>`).join("");
  if(store.days[imp.day])h+=`<label style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" id="useday" style="width:auto"${imp.useDay?" checked":""}><span>${imp.day.split("-").reverse().join(".")} kungi saqlangan hisobotga ham qo'llansin</span></label>`;
  h+=`<div class="row add"><button class="main" id="apply">Tasdiqlash va yangilash</button><button id="cancel">Bekor qilish</button></div>`}
 return h+"</section>"}
function applyImport(){const day=imp.useDay&&store.days[imp.day],map=store.cat.map={...(store.cat.map||{})};let n=0;
 for(const k in WH){store.cat[k].forEach((row,i)=>{const f=imp.items.find(x=>x.key===imp.pick[k+i]),id=k+":"+row[0];
   if(!f){delete map[id];return}map[id]=f.key;if(row[1]!==f.price)n++;row[1]=f.price;
   if(day)day[k].forEach(r=>{if(r.name===row[0])r.price=f.price})});
  imp.add.filter(a=>a.k===k).forEach(a=>{const f=imp.items.find(x=>x.key===a.key);store.cat[k].push([f.name,f.price]);map[k+":"+f.name]=f.key;
   })}
 const added=imp.add.length;if(day){day.at=Date.now();dirty.add(imp.day)}
 draft=null;save("prices");imp=null;impText="";impMsg=`Yangilandi: ${n} ta narx o'zgardi, ${added} ta mahsulot qo'shildi.`}

const store={cat:clone(DEF),catAt:0,days:{}};
const now=new Date(),pad=n=>String(n).padStart(2,"0");
let date=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`,view="day",col=null;
try{Object.assign(store,JSON.parse(localStorage.getItem("yuk")||"{}"))}catch(e){}
const blank=()=>({slim:1,pct:store.cat.pct,nq:[],ut:[],
 pays:["Naqd","Click","Plastik"].map(type=>({type,who:"",amount:"",rate:""})),exps:[{name:"",amount:""}]});
function migrate(){if(store.cat.ver===2)return false;
 store.cat={ver:2,pct:store.cat.pct??0.2,nq:clone(LIST),ut:clone(LIST),map:{}};store.catAt=Date.now();
 return true}
function tidy(){for(const d of Object.values(store.days))if(!d.slim){for(const k in WH)d[k]=d[k].filter(r=>String(r.kg).trim());d.slim=1}}
const moved=migrate();tidy();keep();
let draft=null;
const cur=()=>store.days[date]||(draft&&draft.date===date?draft.d:(draft={date,d:blank()}).d);
const dirty=new Set();let timer,busy=false;
function keep(){try{localStorage.setItem("yuk",JSON.stringify(store))}catch(e){}}
function save(key){if(key==="prices")store.catAt=Date.now();else{const d=cur();d.at=Date.now();store.days[key]=d}
 keep();dirty.add(key);clearTimeout(timer);timer=setTimeout(flush,900)}
async function flush(){if(!col||busy)return;busy=true;
 try{for(const k of [...dirty]){dirty.delete(k);
  try{await col.doc(k==="prices"?k:"day-"+k).set(clone(k==="prices"?{cat:store.cat,at:store.catAt}:store.days[k]));$("#status").textContent="Saqlandi"}
  catch(e){dirty.add(k);$("#status").textContent="Serverga saqlanmadi. Hozircha shu telefonda turibdi, keyingi o'zgarishda qayta uriniladi.";break}}}
 finally{busy=false}}

const item=(k,r,i)=>`<div class="item p${r.custom?" m":""}"><div class="top"><input data-k="${k}" data-i="${i}" data-f="name" id="${k}n${i}" value="${esc(r.name)}" placeholder="Mahsulot nomi" aria-label="Mahsulot nomi"><span class="val" data-line="${k}-${i}"></span><button class="x" data-del="${k}-${i}" aria-label="${esc(r.name)} ni o'chirish">✕</button></div>
<div class="nums"><div class="kg"><input inputmode="decimal" data-k="${k}" data-i="${i}" data-f="kg" id="${k}k${i}" value="${esc(r.kg)}" placeholder="kg" aria-label="${esc(r.name)} kg"><button data-plus="${k}k${i}" aria-label="Yana kg qo'shish">+</button></div><span class="x1">×</span><input inputmode="numeric" data-k="${k}" data-i="${i}" data-f="price" id="${k}p${i}" value="${esc(r.price)}" placeholder="narx" aria-label="Narx"></div></div>`;
const inp=(k,i,f,v,ph,mode="text")=>`<input inputmode="${mode}" data-k="${k}" data-i="${i}" data-f="${f}" id="${k}${f}${i}" value="${esc(v)}" placeholder="${ph}" aria-label="${ph}">`;
function render(){
 document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===view));
 $("#date").hidden=view==="price";$("#date").value=date;
 let h="";
 if(view==="day"){const d=cur();
  for(const k in WH)h+=`<section><h2>${WH[k]}</h2>${d[k].map((r,i)=>item(k,r,i)).join("")||'<div class="mut">Hozircha mahsulot qo\'shilmagan.</div>'}${picker===k?pickerHtml(k):`<button class="add main" data-open-pick="${k}">+ Mahsulot qo'shish</button>`}<div class="sum"><span>Jami</span><span data-t="${k}"></span></div></section>`;
  h+=`<section><h2>Top pul</h2><div class="mut">Bir nechta summani + bilan yozing: 100000+800000</div>${d.pays.map((p,i)=>`<div class="item pay"><select data-k="pays" data-i="${i}" data-f="type" id="pt${i}" aria-label="To'lov turi">${TYPES.map(t=>`<option${t===p.type?" selected":""}>${t}</option>`).join("")}</select>${inp("pays",i,"who",p.who,"Kimdan")}${inp("pays",i,"amount",p.amount,p.type==="Valyuta"?"Dollar ($)":"Summa",p.type==="Valyuta"?"decimal":"tel")}${p.type==="Valyuta"?inp("pays",i,"rate",p.rate,"Kurs","numeric"):""}<span class="val" data-line="pays-${i}"></span><button class="x del" data-del="pays-${i}">✕ O'chirish</button></div>`).join("")}
  <div class="row"><button class="add main" data-add="click">+ Click</button><button class="add" data-add="pays">+ Boshqa to'lov</button></div><div class="mut" data-t="by"></div><div class="sum"><span>Jami pul</span><span data-t="got"></span></div></section>
  <section><h2>Rasxod</h2>${d.exps.map((e,i)=>`<div class="item exp">${inp("exps",i,"name",e.name,"Nimaga")}${inp("exps",i,"amount",e.amount,"Summa","tel")}<button class="x" data-del="exps-${i}" aria-label="O'chirish">✕</button></div>`).join("")}<button class="add" data-add="exps">+ Rasxod</button><div class="sum"><span>Jami rasxod</span><span data-t="exp"></span></div><div class="sum"><span>Naqd qoldiq</span><span data-t="cash"></span></div><div class="mut">Naqddan rasxod ayirilgan. Rasxod naqd puldan to'langan bo'lsa to'g'ri chiqadi.</div></section>
  <section id="plbox"><h2>Plastik</h2><b id="plrows"></b></section>
  <section><h2>Tayyor hisobot</h2><pre id="out"></pre><div class="row"><button class="main" id="png">Rasm qilib yuklash</button><button id="copy">Nusxa olish</button></div><div class="mut" id="imgmsg" role="status" style="margin-top:8px"></div><img id="img" alt="Tayyor hisobot rasmi" style="margin-top:8px;border:1px solid var(--line)" hidden></section>`;
 }else if(view==="month"){const m=date.slice(0,7),{keys,s,kg}=monthData(m);
  h=keys.length?`<section><h2>${m.split("-").reverse().join(".")} (${keys.length} kun)</h2><table><tr><td>Olingan yuk</td><td>${fmt(s.load)}</td></tr><tr><td>Yig'ilgan pul</td><td>${fmt(s.got)}</td></tr><tr><td>Rasxod</td><td>${fmt(s.exp)}</td></tr></table></section><section><button class="main" id="png">Oylik rasmni yuklash</button><div class="mut" id="imgmsg" role="status" style="margin-top:8px"></div><img id="img" alt="Oylik hisobot rasmi" style="margin-top:8px;border:1px solid var(--line)" hidden></section><section><h2>Mahsulotlar</h2><table>${Object.entries(kg).map(([n,v])=>`<tr><td>${esc(n)}</td><td>${kgf(v)} kg</td></tr>`).join("")}</table></section><section><h2>Kunlar</h2><table>${keys.map(k=>`<tr><td><button data-open="${k}">${k.split("-").reverse().join(".")}</button></td><td>${fmt(totals(store.days[k]).load)}</td></tr>`).join("")}</table></section>`:`<section>Bu oyda hali hisobot yo'q. Kunlik bo'limida kg yozsangiz, shu yerda yig'iladi.</section>`;
 }else{h=`<div class="mut">Yangi narxlar hali yozilmagan kunlarga qo'llanadi. Saqlangan kunlarning narxi o'zgarmaydi.</div>`+importHtml();
  for(const k in WH)h+=`<section><h2>${WH[k]}</h2>${store.cat[k].map((r,i)=>`<div class="item exp">${inp("c"+k,i,0,r[0],"Mahsulot")}${inp("c"+k,i,1,r[1],"Narx","numeric")}<button class="x" data-del="c${k}-${i}" aria-label="O'chirish">✕</button></div>`).join("")}<button class="add" data-add="c${k}">+ Mahsulot</button></section>`;
  h+=`<section><h2>Plastikdan ayiriladigan foiz</h2>${inp("pct",0,"pct",store.cat.pct,"Foiz","decimal")}</section><section><h2>Zaxira nusxa</h2><div class="mut" style="margin-bottom:8px">Hamma hisobot va narxlar bitta faylga saqlanadi. Faylni Telegramdagi "Saqlangan xabarlar"ga yuborib qo'ying.</div><button class="main" id="backup">Zaxirani yuklab olish</button><label class="mut" style="display:block;margin-top:12px">Zaxiradan tiklash (faylni tanlang)<input type="file" id="restore" accept=".json,application/json"></label><div class="mut" id="bmsg" role="status" style="margin-top:8px"></div></section>`}
 $("#view").innerHTML=h;calc();filter()}
let query="",picker=null;
const plain=t=>String(t).toLowerCase().replace(/[^\p{L}\p{N}]/gu,"");
function filter(){const q=plain(query);let n=0;document.querySelectorAll("[data-choose]").forEach(e=>{e.hidden=!!q&&!plain(store.cat[picker][e.dataset.choose][0]).includes(q);if(!e.hidden)n++});const x=$("#nofound");if(x)x.hidden=n>0}
function pickerHtml(k){const have=new Set(cur()[k].map(r=>r.name));
 return `<div class="picker"><input type="search" id="q" value="${esc(query)}" placeholder="Qidirish (masalan: arba)" aria-label="Mahsulot qidirish"><div class="choices">${store.cat[k].map(([n,pr],i)=>`<button data-choose="${i}"><span>${have.has(n)?"✓ ":""}${esc(n)}</span><span>${fmt(pr)}</span></button>`).join("")}<div class="mut" id="nofound" hidden>Bunday mahsulot topilmadi.</div></div><div class="row"><button data-custom="${k}">Ro'yxatda yo'q mahsulot</button><button data-close="1">Yopish</button></div></div>`}
function calc(){if(view!=="day")return;const d=cur(),t=totals(d);
 document.querySelectorAll("[data-t]").forEach(e=>{const k=e.dataset.t;e.textContent=k==="cash"?signed(t.cash):k==="by"?TYPES.filter(x=>t.by[x]).map(x=>`${x}: ${fmt(t.by[x])}`).join(" · "):fmt(t[k])});
 document.querySelectorAll("[data-line]").forEach(e=>{const[k,i]=e.dataset.line.split("-"),r=d[k][i];const v=k==="pays"?payVal(d,r):kgv(r.kg)*money(r.price);e.textContent=v?"= "+fmt(v):""});
 $("#plbox").hidden=!t.plRaw;$("#plrows").textContent=t.plRaw?plLine(d,t):"";
 $("#out").textContent=report(date,d);$("#img").hidden=true;$("#imgmsg").textContent=""}
$("#view").addEventListener("input",e=>{const{k,i,f}=e.target.dataset;if(!k)return;const v=e.target.value;
 if(k==="pct"){store.cat.pct=dec(v);save("prices")}
 else if(k[0]==="c"){store.cat[k.slice(1)][i][f]=+f?money(v):v;save("prices");draft=null}
 else{cur()[k][i][f]=v;save(date);if(f==="type")render();else calc();$("#demo")?.remove()}});
$("#view").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.openPick){picker=b.dataset.openPick;query="";render();$("#q").scrollIntoView({block:"start"})}
 else if(b.dataset.close){picker=null;render()}
 else if(b.dataset.choose){const k=picker,[name,price]=store.cat[k][b.dataset.choose],rows=cur()[k];let i=rows.findIndex(r=>r.name===name);
  if(i<0){i=rows.push({name,price,kg:""})-1;save(date)}picker=null;render();$("#"+k+"k"+i).focus()}
 else if(b.dataset.custom){const k=b.dataset.custom,i=cur()[k].push({name:"",price:"",kg:"",custom:true})-1;save(date);picker=null;render();$("#"+k+"n"+i).focus()}
 else if(b.dataset.plus){const f=document.getElementById(b.dataset.plus);if(f.value&&!f.value.endsWith("+")){f.value+="+";f.dispatchEvent(new Event("input",{bubbles:true}))}f.focus();f.setSelectionRange(f.value.length,f.value.length)}
 else if(b.dataset.add==="click"){const l=cur().pays,at=l.map(p=>p.type).lastIndexOf("Click"),i=at<0?l.length:at+1;
  l.splice(i,0,{type:"Click",who:"",amount:"",rate:""});save(date);render();$("#paysamount"+i).focus()}
 else if(b.dataset.add){const k=b.dataset.add;
  if(k[0]==="c"){store.cat[k.slice(1)].push(["",0]);draft=null;save("prices")}
  else{cur()[k].push(k==="pays"?{type:"Naqd",who:"",amount:"",rate:""}:k==="exps"?{name:"",amount:""}:{name:"",price:"",kg:""});save(date)}render()}
 else if(b.dataset.del){const[k,i]=b.dataset.del.split("-");
  if(!b.dataset.sure){b.dataset.sure=1;b.textContent="O'chirilsinmi?";return}
  if(k[0]==="c"){store.cat[k.slice(1)].splice(i,1);draft=null;save("prices")}else{cur()[k].splice(i,1);save(date)}render()}
 else if(b.dataset.open){date=b.dataset.open;view="day";render()}
 else if(b.id==="png")saveImage(b);
 else if(b.id==="backup")backup();
 else if(b.id==="check"){impText=$("#paste").value;startImport(impText);render()}
 else if(b.id==="cancel"){imp=null;impMsg="";render()}
 else if(b.id==="apply"){applyImport();render()}
 else if(b.dataset.new){const key=$("#newitem").value,k=b.dataset.new;if(!key)return;const name=imp.items.find(x=>x.key===key).name;
  if(!imp.add.some(a=>a.k===k&&a.key===key)&&!store.cat[k].some((r,i)=>r[0]===name||imp.pick[k+i]===key))imp.add.push({k,key});
  else impMsg="Bu mahsulot shu omborda bor.";render()}
 else if(b.id==="copy"){try{await navigator.clipboard.writeText($("#out").textContent);b.textContent="Nusxa olindi"}catch(x){getSelection().selectAllChildren($("#out"));b.textContent="Matn belgilandi, nusxalang"}}
});
$("#date").addEventListener("change",e=>{if(e.target.value){picker=null;date=e.target.value;render()}});
$("#view").addEventListener("change",e=>{if(e.target.id==="restore"&&e.target.files[0])restore(e.target.files[0])});
$("#view").addEventListener("change",e=>{if(!imp)return;
 if(e.target.dataset.pick){imp.pick[e.target.dataset.pick]=e.target.value;render()}else if(e.target.id==="useday")imp.useDay=e.target.checked});
$("#view").addEventListener("input",e=>{if(e.target.id==="q"){query=e.target.value;filter()}});
$("#compact").addEventListener("click",()=>setUi("compact",!ui.compact));
$("#theme").addEventListener("click",()=>setUi("theme",isDark()?"light":"dark"));
applyUi();
const todayStr=()=>{const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`};
let lastToday=todayStr();
function newDay(){const t=todayStr();if(t===lastToday)return;if(date===lastToday){date=t;picker=null;render()}lastToday=t}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)newDay()});setInterval(newDay,60000);
document.querySelector("nav").addEventListener("click",e=>{if(e.target.dataset.v){view=e.target.dataset.v;render()}});
render();
(async()=>{try{const db=await window.claude?.use("db"),user=await window.claude?.use("user"),id=await user?.id();
 if(!db||!id){$("#status").textContent="Ma'lumot faqat shu telefonda saqlanadi.";return}
 const c=db.collection("data/users/"+id),snap=await c.get();
 snap.docs.forEach(s=>{const v=clone(s.data());
  if(s.id==="prices"){if(v.at>store.catAt){store.cat=v.cat;store.catAt=v.at;draft=null}}
  else if(s.id.startsWith("day-")){const k=s.id.slice(4);if(!store.days[k]||v.at>store.days[k].at)store.days[k]=v}});
 tidy();col=c;keep();if(!document.activeElement?.matches("input,select"))render();else calc();flush()}
 catch(e){$("#status").textContent="Serverga ulanib bo'lmadi. Ma'lumot shu telefonda saqlanadi."}})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script>
</body></html>
